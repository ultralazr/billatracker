        .tabs {

            padding: 12px 30px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);

        .tab:hover {

            transform: translateY(-2px);
        }
        
        .tab.active {
            background: white;
            color: #667eea;
            border-color: white;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }
        
        .chart-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s ease;
        }
        
        .chart-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }
        
        .chart-header {
            margin-bottom: 20px;
        }
        
        .product-name {
            font-size: 1.3em;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }
        
        .sku-label {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 15px;
        }
        
        .price-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 2px solid #f0f0f0;
        }
        
        .stat {
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        
        .stat-label {
            font-size: 0.8em;
            color: #888;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
        
        .stat-value {
            font-size: 1.2em;
            font-weight: bold;
        }
        
        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }
        
        .stat-change {
            font-size: 0.9em;
            font-weight: 600;
            margin-left: 10px;
        }
        
        .price-increase {
            color: #e74c3c;
        }
        
        .price-decrease {
            color: #27ae60;
        }
        
        .price-current {
            color: #27ae60;
        }
        
        .price-old {
            color: #3498db;
        }
        
        canvas {
            max-height: 300px;
        }
        
        .view {
            display: none;
        }
        
        .view.active {
            display: block;
        }
        
        @media (max-width: 768px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }
            
            h1 {

            }

                align-items: center;
            }

                width: 80%;
            }

                grid-template-columns: 1fr;
            }

      "price_at_3yr_mark": 1.79
    }
  }
};
        const charts = {};
        
        // Calculate 3-year date range for fixed x-axis
        const today = new Date();
        const threeYearsAgo = new Date(today);
        threeYearsAgo.setFullYear(threeYearsAgo.getFullYear() - 3);
        
        // Calculate 1 and 2 year marks
        const oneYearAgo = new Date(today);
        oneYearAgo.setFullYear(oneYearAgo.getFullYear() - 1);
        const twoYearsAgo = new Date(today);
        twoYearsAgo.setFullYear(twoYearsAgo.getFullYear() - 2);
        
        function switchView(period) {
            // Update tabs
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            event.target.classList.add('active');
            
            // Update views
            document.querySelectorAll('.view').forEach(view => view.classList.remove('active'));
            document.getElementById(`view-${period}`).classList.add('active');
        }
        
        function createCharts(period, gridId) {
            const grid = document.getElementById(gridId);
            const data = chartData[period];
            
            Object.keys(data).forEach((sku, index) => {
                const product = data[sku];
                
                // Create card
                const card = document.createElement('div');
                card.className = 'chart-card';
                
                // Create header
                const header = document.createElement('div');
                header.className = 'chart-header';
                header.innerHTML = `
                    <div class="product-name">${product.name}</div>
                    <div class="sku-label">SKU: ${product.sku}</div>
                `;
                card.appendChild(header);
                
                // Create canvas for chart
                const canvas = document.createElement('canvas');
                canvas.id = `chart-${period}-${sku}`;
                card.appendChild(canvas);
                
                // Create stats with compact layout
                const stats = document.createElement('div');
                stats.className = 'price-stats';
                
                // Current Price (always shown)
                let statsHTML = `
                    <div class="stat">
                        <div class="stat-label">Aktueller Preis</div>
                        <div class="stat-value price-current">€${product.price_today.toFixed(2)}</div>
                    </div>
                `;
                
                // 1 Year Ago (price + change in same tile)
                if (product.price_1yr !== null && product.change_1yr !== null) {
                    const changeClass = product.change_1yr >= 0 ? 'price-increase' : 'price-decrease';
                    const changeText = product.change_1yr >= 0 ? `+${product.change_1yr.toFixed(2)}%` : `${product.change_1yr.toFixed(2)}%`;
                    statsHTML += `
                        <div class="stat">
                            <div class="stat-label">Vor 1 Jahr</div>
                            <div class="stat-row">
                                <span class="stat-value price-old">€${product.price_1yr.toFixed(2)}</span>
                                <span class="stat-change ${changeClass}">${changeText}</span>
                            </div>
                        </div>
                    `;
                }
                
                // 2 Years Ago (price + change in same tile)
                if (product.price_2yr !== null && product.change_2yr !== null) {
                    const changeClass = product.change_2yr >= 0 ? 'price-increase' : 'price-decrease';
                    const changeText = product.change_2yr >= 0 ? `+${product.change_2yr.toFixed(2)}%` : `${product.change_2yr.toFixed(2)}%`;
                    statsHTML += `
                        <div class="stat">
                            <div class="stat-label">Vor 2 Jahren</div>
                            <div class="stat-row">
                                <span class="stat-value price-old">€${product.price_2yr.toFixed(2)}</span>
                                <span class="stat-change ${changeClass}">${changeText}</span>
                            </div>
                        </div>
                    `;
                } else {
                    statsHTML += `
                        <div class="stat">
                            <div class="stat-label">Vor 2 Jahren</div>
                            <div class="stat-value" style="color: #999;">N/A</div>
                        </div>
                    `;
                }
                
                // 3 Years Ago (price + change in same tile)
                if (product.price_3yr !== null && product.change_3yr !== null) {
                    const changeClass = product.change_3yr >= 0 ? 'price-increase' : 'price-decrease';
                    const changeText = product.change_3yr >= 0 ? `+${product.change_3yr.toFixed(2)}%` : `${product.change_3yr.toFixed(2)}%`;
                    statsHTML += `
                        <div class="stat">
                            <div class="stat-label">Vor 3 Jahren</div>
                            <div class="stat-row">
                                <span class="stat-value price-old">€${product.price_3yr.toFixed(2)}</span>
                                <span class="stat-change ${changeClass}">${changeText}</span>
                            </div>
                        </div>
                    `;
                } else {
                    statsHTML += `
                        <div class="stat">
                            <div class="stat-label">Vor 3 Jahren</div>
                            <div class="stat-value" style="color: #999;">N/A</div>
                        </div>
                    `;
                }
                
                stats.innerHTML = statsHTML;
                card.appendChild(stats);
                
                grid.appendChild(card);
                
                // Create chart with step plot and FIXED 3-year x-axis
                const ctx = canvas.getContext('2d');
                
                // Convert string dates to Date objects for proper time axis
                const dateData = product.dates.map((date, i) => ({
                    x: date,
                    y: product.prices[i]
                }));
                
                // If there's a price at the 3-year mark from before our window, add it as the first point
                if (product.price_at_3yr_mark !== null && product.price_at_3yr_mark !== undefined) {
                    // Check if we need to add the historical price point
                    const firstDataDate = new Date(product.dates[0]);
                    if (firstDataDate > threeYearsAgo) {
                        // Add a point at the 3-year mark with the historical price
                        dateData.unshift({
                            x: threeYearsAgo.toISOString().split('T')[0],
                            y: product.price_at_3yr_mark
                        });
                    }
                }
                
                charts[`${period}-${sku}`] = new Chart(ctx, {
                    type: 'line',
                    data: {
                        datasets: [{
                            label: 'Preis (€)',
                            data: dateData,
                            borderColor: index % 2 === 0 ? '#667eea' : '#e74c3c',
                            backgroundColor: index % 2 === 0 ? 'rgba(102, 126, 234, 0.1)' : 'rgba(231, 76, 60, 0.1)',
                            borderWidth: 3,
                            stepped: true,
                            fill: true,
                            pointRadius: 2,
                            pointHoverRadius: 6,
                            pointBackgroundColor: '#fff',
                            pointBorderWidth: 2
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: true,
                        plugins: {
                            legend: {
                                display: false
                            },
                            tooltip: {
                                mode: 'index',
                                intersect: false,
                                callbacks: {
                                    label: function(context) {
                                        return 'Price: €' + context.parsed.y.toFixed(2);
                                    }
                                }
                            },
                            annotation: {
                                annotations: {
                                    line1yr: {
                                        type: 'line',
                                        xMin: oneYearAgo.getTime(),
                                        xMax: oneYearAgo.getTime(),
                                        borderColor: 'rgba(100, 100, 100, 0.5)',
                                        borderWidth: 3,
                                        label: {
                                            display: true,
                                            content: '1YR',
                                            position: 'start',
                                            backgroundColor: 'rgba(100, 100, 100, 0.8)',
                                            color: 'white',
                                            font: {
                                                size: 11,
                                                weight: 'bold'
                                            }
                                        }
                                    },
                                    line2yr: {
                                        type: 'line',
                                        xMin: twoYearsAgo.getTime(),
                                        xMax: twoYearsAgo.getTime(),
                                        borderColor: 'rgba(100, 100, 100, 0.5)',
                                        borderWidth: 3,
                                        label: {
                                            display: true,
                                            content: '2YR',
                                            position: 'start',
                                            backgroundColor: 'rgba(100, 100, 100, 0.8)',
                                            color: 'white',
                                            font: {
                                                size: 11,
                                                weight: 'bold'
                                            }
                                        }
                                    },
                                    line3yr: {
                                        type: 'line',
                                        xMin: threeYearsAgo.getTime(),
                                        xMax: threeYearsAgo.getTime(),
                                        borderColor: 'rgba(100, 100, 100, 0.5)',
                                        borderWidth: 3,
                                        label: {
                                            display: true,
                                            content: '3YR',
                                            position: 'start',
                                            backgroundColor: 'rgba(100, 100, 100, 0.8)',
                                            color: 'white',
                                            font: {
                                                size: 11,
                                                weight: 'bold'
                                            }
                                        }
                                    }
                                }
                            }
                        },
                        scales: {
                            x: {
                                type: 'time',
                                time: {
                                    unit: 'month',
                                    displayFormats: {
                                        month: 'MMM yyyy'
                                    }
                                },
                                min: threeYearsAgo.getTime(),
                                max: today.getTime(),
                                display: true,
                                title: {
                                    display: true,
                                    text: 'Date'
                                },
                                ticks: {
                                    maxTicksLimit: 10,
                                    maxRotation: 45,
                                    minRotation: 45
                                }
                            },
                            y: {
                                display: true,
                                title: {
                                    display: true,
                                    text: 'Preis (€)'
                                },
                                ticks: {
                                    callback: function(value) {
                                        return '€' + value.toFixed(2);
                                    }
                                }
                            }
                        },
                        interaction: {
                            mode: 'nearest',
                            axis: 'x',
                            intersect: false
                        }
                    }
                });
            });
        }
        
        // Initialize all charts
        createCharts('1yr', 'chartsGrid1yr');
        createCharts('2yr', 'chartsGrid2yr');
        createCharts('3yr', 'chartsGrid3yr');
    </script>
</body>
</html>
