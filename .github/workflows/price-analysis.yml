name: Billa Price Analysis

on:
  workflow_run:
    workflows: ["Billa Price Scraper"]
    types:
      - completed
  workflow_dispatch:  # Allow manual trigger for testing

jobs:
  analyze-prices:
    runs-on: ubuntu-latest
    
    # Only run if the previous workflow succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    
    permissions:
      contents: write  # Required to commit and push changes
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: main  # Make sure we're on the main branch
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-analysis.txt
    
    - name: Run price analysis
      run: |
        python billa_analysis_for_claude.py
    
    - name: Commit and push results
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        # Add the generated files
        git add price_analysis_report.html
        git add price_analysis.csv
        git add top_10_1yr_increases.csv
        git add top_10_2yr_increases.csv
        git add top_10_3yr_increases.csv
        
        # Commit if there are changes
        git diff --staged --quiet || git commit -m "Update price analysis report [automated]"
        
        # Push changes
        git push
    
    - name: Deploy to GitHub Pages (optional)
      uses: peaceiris/actions-gh-pages@v3
      if: success()
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./
        publish_branch: gh-pages
        keep_files: true
        destination_dir: analysis
