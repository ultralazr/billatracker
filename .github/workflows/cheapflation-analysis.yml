name: Cheapflation Analysis

on:
  # Trigger manually
  workflow_dispatch:
  
  # Trigger after the "Billa Price Analysis" workflow completes
  workflow_run:
    workflows: ["Billa Price Analysis"]
    types:
      - completed
  
  # Optional: Also run on a schedule (e.g., daily at a specific time)
  # schedule:
  #   - cron: '0 2 * * *'  # Runs at 2 AM UTC daily

# Grant write permissions to the GITHUB_TOKEN
permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    
    # Only run if the triggering workflow succeeded (skip if manually triggered)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cheapflation.txt
      
      - name: Run cheapflation analysis
        run: |
          python cheapflation_gh_actions.py
      
      - name: Commit and push results
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add output/
          git diff --staged --quiet || git commit -m "Update cheapflation analysis results [$(date +'%Y-%m-%d %H:%M:%S UTC')]"
          git push
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cheapflation-report-${{ github.run_number }}
          path: output/
          retention-days: 30
